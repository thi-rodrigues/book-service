server:
  port: 8100
  
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  
      
resilience4j:
  retry:
    instances:
      foo-bar: # Nome da sua instância @Retry(name = "foo-bar")
        max-attempts: 7 # Quantas vezes ele vai tentar executar essa atividade até falhar
        wait-duration: 1s #tempo de espera para nova tentatia "Retry"
        enable-exponential-backoff: true # habilitar o multiplicador de requisição
        exponentialBackoffMultiplier: 1 # multiplicador do tempo de espera cada requisição pelo valor "1"
  ratelimiter:
    instances:
      default:
        limit-for-period: 2 #2 requisições
        limit-refresh-period: 10s #Só pode ter 2 requisições a cada 10 segundos
  bulkhead:
    instances:
      default:
        max-concurrent-calls: 10
      foo-bar:
        max-concurrent-calls: 10

spring:
